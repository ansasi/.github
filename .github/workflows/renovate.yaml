---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Renovate
run-name: Renovate (${{ (inputs.autodiscoverFilter == '*' && 'all repos') || inputs.autodiscoverFilter || 'all repos' }})

on:
  schedule:
    - cron: "20 */12 * * *"
  workflow_dispatch:
    inputs:
      dryRun:
        description: Dry Run
        default: false
        required: false
        type: boolean
      autodiscoverFilter:
        description: Autodiscover Filter
        default: "*"
        required: false
      logLevel:
        description: Log Level
        type: choice
        default: debug
        options:
          - debug
          - info
      repoCache:
        description: Repository cache
        type: choice
        default: enabled
        options:
          - enabled
          - disabled
          - reset

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.RENOVATE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-checks: write
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: write
          permission-vulnerability-alerts: read
          permission-workflows: write

      - name: Restore Renovate repository cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/renovate/cache/renovate/repository
          key: renovate-repository-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: renovate-repository-cache-

      - name: Align cache ownership for the Renovate container
        run: |
          sudo mkdir -p /tmp/renovate/cache/renovate/repository
          # Renovate runs in its container as uid 12021; give it ownership so it
          # can read and rewrite the restored cache.
          sudo chown -R 12021:0 /tmp/renovate

      - name: Renovate
        uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774 # v46.3.14
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'debug' }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun == true }}
          RENOVATE_AUTODISCOVER: true
          RENOVATE_AUTODISCOVER_FILTER: ${{ github.repository_owner }}/${{ inputs.autodiscoverFilter || '*' }}
          RENOVATE_INTERNAL_CHECKS_FILTER: strict
          RENOVATE_PLATFORM: github
          RENOVATE_PLATFORM_COMMIT: true
          # Open an onboarding PR in every repository without a Renovate config,
          # pre-filled to extend the shared preset.
          RENOVATE_ONBOARDING: true
          RENOVATE_ONBOARDING_CONFIG: '{"$schema": "https://docs.renovatebot.com/renovate-schema.json", "extends": ["local>ansasi/renovate-config"]}'
          RENOVATE_REPOSITORY_CACHE: ${{ inputs.repoCache || 'enabled' }}
          RENOVATE_PRESET_CACHE_PERSISTENCE: "true"
          # Docker Hub login for the registry (docker.io): authenticated pulls of
          # tags and manifests get Docker Hub's higher rate limits. It doesn't
          # give release dates for images with more than about 1,000 tags:
          # Docker Hub's API (hub.docker.com) ignores this login and only accepts
          # a bearer token that expires after 10 minutes, so the shared preset
          # holds those images instead.
          RENOVATE_HOST_RULES: >-
            [{"hostType":"docker","matchHost":"docker.io","username":"${{ secrets.DOCKERHUB_USERNAME }}","password":"${{ secrets.DOCKERHUB_TOKEN }}"}]
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Save Renovate repository cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/renovate/cache/renovate/repository
          key: renovate-repository-cache-${{ github.run_id }}-${{ github.run_attempt }}

      # Undated images (GHCR, Quay, OCI charts) carry no release date, so
      # Renovate's 7-day wait can't hold them and the shared preset never
      # automerges them. This merges those PRs by their labels alone, once the
      # newest commit on the branch is 7 days old and every check is green.
      # Which labels mean what: ansasi/renovate-config, "Undated images".
      # After Renovate, so a branch it just pushed is never 7 days old.
      - name: Merge undated PRs that waited 7 days
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DRY_RUN: ${{ inputs.dryRun == true }}
          # Every one of these, at least one of the "any" ones, none of the blocking ones.
          REQUIRED_LABELS: undated trusted
          ANY_LABELS: type/patch type/minor type/digest
          BLOCKING_LABELS: type/major calver database manual
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          wait=$((7 * 24 * 3600))
          to_json() { printf '%s\n' "$@" | jq -R . | jq -sc .; }
          # shellcheck disable=SC2086 # the label lists are split on purpose
          filter=$(jq -nc --argjson req "$(to_json $REQUIRED_LABELS)" \
            --argjson any "$(to_json $ANY_LABELS)" --argjson block "$(to_json $BLOCKING_LABELS)" \
            '{req: $req, any: $any, block: $block}')
          repos=$(gh api --paginate /installation/repositories \
            --jq '.repositories[] | select(.archived | not) | .full_name')
          for repo in $repos; do
            prs=$(gh api --paginate "repos/$repo/pulls?state=open&per_page=100" |
              jq -r --argjson f "$filter" '.[]
                | select(.head.ref | startswith("renovate/")) | select(.draft | not)
                | [.labels[].name] as $l
                | select(all($f.req[]; IN($l[])) and any($f.any[]; IN($l[]))
                    and (any($f.block[]; IN($l[])) | not))
                | "\(.number) \(.head.sha)"')
            while read -r number sha; do
              [ -n "$number" ] || continue
              pr="$repo#$number ${sha:0:7}"
              committed=$(gh api "repos/$repo/commits/$sha" --jq '.commit.committer.date')
              ready=$(( $(date -u -d "$committed" +%s) + wait ))
              if [ "$ready" -gt "$now" ]; then
                echo "$pr: waits until $(date -u -d "@$ready" +'%Y-%m-%d %H:%M') UTC"
                continue
              fi
              # Every check run finished and passed, every commit status
              # succeeded, and at least one of them exists.
              runs=$(gh api --paginate "repos/$repo/commits/$sha/check-runs?per_page=100" \
                --jq '.check_runs[] | "\(.status) \(.conclusion)"')
              statuses=$(gh api "repos/$repo/commits/$sha/status" --jq '"\(.state) \(.total_count)"')
              if [ -z "$runs" ] && [ "${statuses#* }" = "0" ]; then
                echo "$pr: no checks, left for review"
                continue
              fi
              if [ -n "$runs" ] && grep -qvE '^completed (success|neutral|skipped)$' <<< "$runs"; then
                echo "$pr: check runs not green"
                continue
              fi
              if [ "${statuses#* }" != "0" ] && [ "${statuses% *}" != "success" ]; then
                echo "$pr: commit statuses not green (${statuses% *})"
                continue
              fi
              mergeable=$(gh api "repos/$repo/pulls/$number" --jq '.mergeable')
              if [ "$mergeable" != "true" ]; then
                echo "$pr: not mergeable yet ($mergeable)"
                continue
              fi
              echo "$pr: merging"
              if [ "$DRY_RUN" = "true" ]; then
                continue
              fi
              # --match-head-commit: never merge a commit that wasn't checked.
              gh pr merge "$number" --repo "$repo" --squash --match-head-commit "$sha"
            done <<< "$prs"
          done
