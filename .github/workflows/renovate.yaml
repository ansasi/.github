---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Renovate
run-name: Renovate (${{ (inputs.autodiscoverFilter == '*' && 'all repos') || inputs.autodiscoverFilter || 'all repos' }})

on:
  schedule:
    - cron: "20 */12 * * *"
  workflow_dispatch:
    inputs:
      dryRun:
        description: Dry Run
        default: false
        required: false
        type: boolean
      autodiscoverFilter:
        description: Autodiscover Filter
        default: "*"
        required: false
      logLevel:
        description: Log Level
        type: choice
        default: debug
        options:
          - debug
          - info
      repoCache:
        description: Repository cache
        type: choice
        default: enabled
        options:
          - enabled
          - disabled
          - reset

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.RENOVATE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-checks: write
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: write
          permission-vulnerability-alerts: read
          permission-workflows: write

      # Undated images (GHCR, Quay, OCI charts) carry no release date, so the
      # shared preset's trusted.json5 counts the 7-day wait from the PR: this
      # sets the undated-age status on every open `undated` PR, pending until
      # the newest commit on its branch is 7 days old. Renovate only automerges
      # when every check is green, so it must run first: if it fails, the job
      # stops before Renovate. Not prefixed renovate/: Renovate ignores its
      # own successful renovate/ statuses.
      - name: Set the 7-day status on undated PRs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DRY_RUN: ${{ inputs.dryRun == true }}
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          wait=$((7 * 24 * 3600))
          repos=$(gh api --paginate /installation/repositories \
            --jq '.repositories[] | select(.archived | not) | .full_name')
          for repo in $repos; do
            prs=$(gh api --paginate "repos/$repo/pulls?state=open&per_page=100" \
              --jq '.[] | select(.head.ref | startswith("renovate/"))
                | select(any(.labels[]; .name == "undated"))
                | "\(.number) \(.head.sha)"')
            while read -r number sha; do
              [ -n "$number" ] || continue
              committed=$(gh api "repos/$repo/commits/$sha" --jq '.commit.committer.date')
              ready=$(( $(date -u -d "$committed" +%s) + wait ))
              if [ "$ready" -le "$now" ]; then
                state=success
                description="7 days since the last commit ($committed)"
              else
                state=pending
                description="Waits until $(date -u -d "@$ready" +'%Y-%m-%d %H:%M') UTC, 7 days after the last commit"
              fi
              current=$(gh api "repos/$repo/commits/$sha/status" \
                --jq '[.statuses[] | select(.context == "undated-age") | .state][0] // ""')
              echo "$repo#$number ${sha:0:7}: $state (was ${current:-none})"
              if [ "$current" = "$state" ] || [ "$DRY_RUN" = "true" ]; then
                continue
              fi
              gh api -X POST "repos/$repo/statuses/$sha" --silent \
                -f state="$state" -f context=undated-age -f description="$description"
            done <<< "$prs"
          done

      - name: Restore Renovate repository cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/renovate/cache/renovate/repository
          key: renovate-repository-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: renovate-repository-cache-

      - name: Align cache ownership for the Renovate container
        run: |
          sudo mkdir -p /tmp/renovate/cache/renovate/repository
          # Renovate runs in its container as uid 12021; give it ownership so it
          # can read and rewrite the restored cache.
          sudo chown -R 12021:0 /tmp/renovate

      - name: Renovate
        uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774 # v46.3.14
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'debug' }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun == true }}
          RENOVATE_AUTODISCOVER: true
          RENOVATE_AUTODISCOVER_FILTER: ${{ github.repository_owner }}/${{ inputs.autodiscoverFilter || '*' }}
          RENOVATE_INTERNAL_CHECKS_FILTER: strict
          RENOVATE_PLATFORM: github
          RENOVATE_PLATFORM_COMMIT: true
          # Open an onboarding PR in every repository without a Renovate config,
          # pre-filled to extend the shared preset.
          RENOVATE_ONBOARDING: true
          RENOVATE_ONBOARDING_CONFIG: '{"$schema": "https://docs.renovatebot.com/renovate-schema.json", "extends": ["local>ansasi/renovate-config"]}'
          RENOVATE_REPOSITORY_CACHE: ${{ inputs.repoCache || 'enabled' }}
          RENOVATE_PRESET_CACHE_PERSISTENCE: "true"
          # Docker Hub login for the registry (docker.io): authenticated pulls of
          # tags and manifests get Docker Hub's higher rate limits. It doesn't
          # give release dates for images with more than about 1,000 tags:
          # Docker Hub's API (hub.docker.com) ignores this login and only accepts
          # a bearer token that expires after 10 minutes, so the shared preset
          # holds those images instead.
          RENOVATE_HOST_RULES: >-
            [{"hostType":"docker","matchHost":"docker.io","username":"${{ secrets.DOCKERHUB_USERNAME }}","password":"${{ secrets.DOCKERHUB_TOKEN }}"}]
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Save Renovate repository cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/renovate/cache/renovate/repository
          key: renovate-repository-cache-${{ github.run_id }}-${{ github.run_attempt }}